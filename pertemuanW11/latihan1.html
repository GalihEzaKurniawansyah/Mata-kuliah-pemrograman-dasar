<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Praktikum 1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            transition: color 0.3s ease; /* Efek transisi halus saat warna berubah */
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="teks-target">Warna Teks Ini Akan Berubah!</h1>
        
        <button onclick="ubahWarna()">Ubah Warna</button>
    </div>

    <script>
        function ubahWarna() {
            const teks = document.getElementById("teks-target");
            const warnaAcak = '#' + Math.floor(Math.random()*16777215).toString(16);
            teks.style.color = warnaAcak;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Biodata Mahasiswa</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }

        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef7ee;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
            display: none;
        }

        .output-box h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.1rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .output-box p {
            margin: 8px 0;
            color: #555;
            font-size: 15px;
        }

        .output-box span {
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Biodata Mahasiswa</h2>
        
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama mahasiswa...">
        </div>

        <div class="form-group">
            <label for="nim">NIM (Nomor Induk Mahasiswa)</label>
            <input type="text" id="nim" placeholder="Masukkan NIM...">
        </div>

        <button id="btnTampilkan">Tampilkan Data</button>

        <div id="outputContainer" class="output-box">
            <h3>Hasil Biodata:</h3>
            <p>Nama: <span id="hasilNama">-</span></p>
            <p>NIM: <span id="hasilNim">-</span></p>
        </div>
    </div>

    <script>
        const inputNama = document.getElementById('nama');
        const inputNim = document.getElementById('nim');
        const tombolTampilkan = document.getElementById('btnTampilkan');
        
        const outputContainer = document.getElementById('outputContainer');
        const hasilNama = document.getElementById('hasilNama');
        const hasilNim = document.getElementById('hasilNim');

        tombolTampilkan.addEventListener('click', function() {

            const namaValue = inputNama.value.trim();
            const nimValue = inputNim.value.trim();

            if (namaValue === "" || nimValue === "") {
                alert("Mohon isi Nama dan NIM terlebih dahulu!");
                return;
            }

            hasilNama.innerText = namaValue;
            hasilNim.innerText = nimValue;

            outputContainer.style.display = "block";
        });
    </script>

</body>
</html>

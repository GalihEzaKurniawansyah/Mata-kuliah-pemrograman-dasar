<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Mahasiswa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #btnSimpan {
            background-color: #2ecc71;
            color: white;
        }

        #btnSimpan:hover {
            background-color: #27ae60;
        }

        #btnTampilkan {
            background-color: #3498db;
            color: white;
        }

        #btnTampilkan:hover {
            background-color: #2980b9;
        }

        .output-section {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        h3 {
            color: #333;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sistem Data Mahasiswa</h2>
        
        <div class="form-group">
            <label for="nama">Nama Mahasiswa:</label>
            <input type="text" id="nama" placeholder="Masukkan nama mahasiswa">
        </div>

        <div class="form-group">
            <label for="nilai">Nilai:</label>
            <input type="number" id="nilai" placeholder="Masukkan nilai (0-100)" min="0" max="100">
        </div>

        <div class="button-group">
            <button id="btnSimpan">Simpan</button>
            <button id="btnTampilkan">Tampilkan</button>
        </div>

        <div class="output-section">
            <h3>Daftar Mahasiswa</h3>
            <div id="tempatTabel">
                <p style="color: #888; font-style: italic;">Belum ada data yang ditampilkan.</p>
            </div>
        </div>
    </div>

    <script>
        const dataMahasiswa = [];

        const inputNama = document.getElementById('nama');
        const inputNilai = document.getElementById('nilai');
        const btnSimpan = document.getElementById('btnSimpan');
        const btnTampilkan = document.getElementById('btnTampilkan');
        const tempatTabel = document.getElementById('tempatTabel');

        function simpanData() {
            const nama = inputNama.value.trim();
            const nilai = inputNilai.value.trim();

            if (nama === "" || nilai === "") {
                alert("Semua data input harus diisi!");
                return;
            }

            dataMahasiswa.push({
                nama: nama,
                nilai: nilai
            });

            inputNama.value = "";
            inputNilai.value = "";

            alert("Data mahasiswa berhasil disimpan!");
        }

        function tampilkanData() {
            if (dataMahasiswa.length === 0) {
                tempatTabel.innerHTML = `<p style="color: #e74c3c; font-style: italic;">Data kosong. Silakan simpan data terlebih dahulu.</p>`;
                return;
            }

            let tabelHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Nilai</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            dataMahasiswa.forEach((mahasiswa, index) => {
                tabelHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${mahasiswa.nama}</td>
                        <td>${mahasiswa.nilai}</td>
                    </tr>
                `;
            });

            tabelHTML += `
                    </tbody>
                </table>
            `;

            tempatTabel.innerHTML = tabelHTML;
        }

        btnSimpan.addEventListener('click', simpanData);
        btnTampilkan.addEventListener('click', tampilkanData);
    </script>
</body>
</html>
